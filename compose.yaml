services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: trading_orders
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db:/workspace/db:ro
    command: ['postgres', '-c', 'timezone=UTC']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U trading -d trading_orders']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
