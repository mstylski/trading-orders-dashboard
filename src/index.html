<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Otwarte zlecenia | Trading Desk</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      let theme = 'system';
      try {
        const saved = localStorage.getItem('trading-orders-theme');
        if (saved === 'light' || saved === 'dark') {
          theme = saved;
        }
      } catch {}
      document.documentElement.dataset.theme =
        theme === 'system'
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
          : theme;
    </script>
    <style>
      :root[data-theme='dark'] {
        color-scheme: dark;
        --background: rgb(42, 56, 71);
        --text: rgb(198, 210, 219);
        --row: rgba(14, 15, 26, 0.25);
        --row-hover: rgba(53, 71, 89, 0.5);
        --surface: #263342;
        --detail: #293747;
        --muted: #a0b0c0;
        --border: #415161;
        --border-soft: #344555;
        --accent: #3cc195;
        --accent-contrast: #102b24;
        --focus: #80beff;
        --buy-bg: #25493f;
        --buy-text: #83dbb9;
        --sell-bg: #4b3540;
        --sell-text: #ffadb5;
        --warning: #e9b65a;
        --warning-text: #e9c788;
        --error-text: #ffacb3;
      }
    </style>
    <meta name="description" content="Panel zleceń z bieżącymi kwotowaniami i wynikami pozycji." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://geeksoft.pl" crossorigin />
  </head>
  <body>
    <app-orders-page></app-orders-page>
  </body>
</html>
